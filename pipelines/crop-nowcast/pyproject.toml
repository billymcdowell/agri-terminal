[project]
name = "crop-nowcast"
version = "0.1.0"
description = "Weekly corn and soybean yield, acreage and crop damage nowcasts for AgriTerminal, built from public data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
# A pipeline, not a library: run from this folder with `uv run`, never installed.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
