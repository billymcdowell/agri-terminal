[package]
name = "agri-terminal"
version = "0.1.0"
description = "Desktop market terminal for grain and oilseed futures"
authors = ["William McDowell"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agri_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "query"] }
chrono = { version = "0.4.45", features = ["serde"] }
toml = "1.1.8"
csv = "1.4.0"
calamine = "0.37.0"
feed-rs = "3.0.0"
keyring = "4.2.0"
anyhow = "1.0.104"
thiserror = "2.0.21"
async-trait = "0.1.92"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tracing-appender = "0.2.5"
url = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
