name: Nightly provider contracts

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

jobs:
  live-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Run ignored provider contract checks
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --ignored
